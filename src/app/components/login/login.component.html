<div class="login-container">

  <!-- Fullscreen Premium Preloader -->
  <div class="preload-overlay animate-fade-in" *ngIf="loadingPreload">
    <div class="preload-card glass-panel text-center">
      <div class="spinner-container">
        <div class="outer-ring"></div>
        <div class="inner-ring"></div>
        <div class="water-droplet">🌱</div>
      </div>
      <h3 class="preload-title text-neon-blue mt-4">Sincronizando Plataforma Agrosistemas</h3>
      <p class="preload-status mt-2">{{ preloadMessage }}</p>
    </div>
  </div>

  <!-- Decorative background elements -->
  <div class="orb orb-blue"></div>
  <div class="orb orb-purple"></div>

  <div class="glass-panel login-card">
    <div class="header">
      <h1 class="text-neon-blue">Pensamiento Sistémico</h1>
      <p class="subtitle">Estrategia Pedagógica Agroecología y DSSAT</p>
      <h2 class="text-neon-purple mt-2">Simulador Digital de Agrosistemas</h2>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email" placeholder="Ingrese su correo" autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" placeholder="Ingrese su contraseña" />
      </div>

      <div class="login-footer">
        <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-neon mt-4">INGRESAR</button>
    </form>

    <div class="guest-divider">
      <span>Acceso Rápido</span>
    </div>

    <button type="button" class="btn-admin" (click)="loginAsAdmin()" [disabled]="loadingAdmin">
      <span *ngIf="!loadingAdmin">Ingresar como Administrador</span>
      <span *ngIf="loadingAdmin">Ingresando como Admin...</span>
    </button>
  </div>
</div>
